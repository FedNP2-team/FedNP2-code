[project]
name = "fednp2-core"
version = "0.1.0"
description = "Core components of FedNP2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "torchvision>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "datasets*", "utils*", "backbone*"]
